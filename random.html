<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>generate password is: <span id="show"></span></p>
    <button onclick="generate()">generate password</button>
    <script>
        function generate(){
            var passwordList="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPRSTUVWXYZ0123456789@#$%",
            password=[]
            //console.log(math.floor(math.random()*18))
            //console.log(passwordlist.charAt(60))
            for(i=0;i<6;i++){
                var randomNumber=Math.floor(Math.random()*passwordList.length)
                //console.log(random number)
                var randomCharacter=passwordList.charAt(randomNumber)
                password.push(randomCharacter)
                
            }
            password=password.join("")
            console.log(password)
            document.getElementById("show").innerHTML=password
        }
    </script>
    
</body>
</html>
